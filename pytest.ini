
[pytest]
# Añade la raíz del proyecto a sys.path (mecanismo oficial de pytest
# desde la versión 7.0) para que `from models.player import Player`,
# `from services.save_service import SaveService`, etc. se resuelvan
# al correr `pytest` desde la raíz del proyecto, sin depender de que
# el proyecto esté instalado como paquete ni de fijar PYTHONPATH a
# mano. Sin esto, pytest inserta en sys.path el directorio de cada
# archivo de prueba (tests/), no la raíz del proyecto, y todos los
# imports de tests/*.py fallarían.
pythonpath = .
 
testpaths = tests
 
